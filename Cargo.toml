[workspace]
resolver = "2"
members = [
    "crates/quarry-core",
    "crates/quarry-dsl",
    "crates/quarry-adapters",
    "crates/quarry-engine",
    "crates/quarry-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

quarry-core = { path = "crates/quarry-core" }
quarry-dsl = { path = "crates/quarry-dsl" }
quarry-adapters = { path = "crates/quarry-adapters" }
quarry-engine = { path = "crates/quarry-engine" }

[profile.release]
lto = "thin"
